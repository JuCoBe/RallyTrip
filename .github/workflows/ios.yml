name: iOS build and core tests
on: [push, pull_request, workflow_dispatch]
jobs:
  verify:
    runs-on: macos-15
    defaults:
      run:
        working-directory: RallyTrip
    steps:
      - uses: actions/checkout@v4
      - name: Verify active project structure
        run: node scripts/verify-project.mjs
      - name: Core calculations and GPS filtering
        run: swift test
      - name: Compile iPhone app
        run: xcodebuild -project RallyTrip.xcodeproj -scheme RallyTrip -configuration Debug -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Compile Apple Watch app
        run: xcodebuild -project RallyTrip.xcodeproj -scheme RallyWatch -configuration Debug -destination 'generic/platform=watchOS Simulator' CODE_SIGNING_ALLOWED=NO build
